[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guardrails-lab"
version = "0.1.0"
description = "A local-first learning lab for practical AI guardrails."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
groq = ["groq>=0.11,<2"]

[project.scripts]
guardrails-lab = "guardrails_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/guardrails_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

